<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sealed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F2E8D2;
    --parchment-light: #F8F1DE;
    --parchment-deep: #E5D6B0;
    --ink: #2A1810;
    --ink-soft: #4A3528;
    --sienna: #A8421C;
    --gold: #B68A3E;
    --shadow: rgba(60, 30, 15, 0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Crimson Text', Georgia, serif;
    color: var(--ink);
    background: var(--parchment);
    background-image:
      radial-gradient(ellipse at top, rgba(184, 138, 62, 0.10) 0%, transparent 60%),
      radial-gradient(ellipse at bottom, rgba(168, 66, 28, 0.06) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(168, 138, 80, 0.015) 0px, rgba(168, 138, 80, 0.015) 1px, transparent 1px, transparent 4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.4;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(circle at 25% 25%, rgba(60, 30, 15, 0.04) 1px, transparent 2px),
      radial-gradient(circle at 75% 75%, rgba(60, 30, 15, 0.03) 1px, transparent 2px);
    background-size: 80px 80px, 60px 60px;
  }
  .envelope {
    position: relative;
    z-index: 2;
    max-width: 460px;
    width: 100%;
    padding: 60px 50px;
    background: var(--parchment-light);
    border: 1px solid var(--parchment-deep);
    box-shadow: 0 2px 0 var(--parchment-deep), 0 12px 40px var(--shadow);
    text-align: center;
  }
  .envelope::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid var(--parchment-deep);
    pointer-events: none;
  }
  .seal {
    font-size: 28px;
    color: var(--sienna);
    margin-bottom: 24px;
    opacity: 0.85;
  }
  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--sienna);
    text-transform: uppercase;
    margin-bottom: 18px;
    font-weight: 500;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 42px;
    line-height: 1.05;
    color: var(--ink);
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--sienna); font-weight: 400; }
  .hint {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink-soft);
    margin-bottom: 36px;
    line-height: 1.5;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  input[type=password] {
    font-family: 'Crimson Text', serif;
    font-size: 18px;
    padding: 14px 18px;
    background: var(--parchment);
    border: 1px solid var(--ink);
    border-radius: 0;
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.1em;
    width: 100%;
    transition: background 0.2s;
  }
  input[type=password]:focus {
    outline: none;
    background: #fff;
    box-shadow: 0 0 0 2px var(--gold);
  }
  button {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 14px 24px;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    cursor: pointer;
    transition: background 0.2s;
    font-weight: 500;
  }
  button:hover { background: var(--sienna); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .error {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--sienna);
    margin-top: 16px;
    min-height: 22px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .error.show { opacity: 1; }
  footer {
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--parchment-deep);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main class="envelope">
    <div class="seal">❦</div>
    <div class="eyebrow">— Sealed —</div>
    <h1>A <em>Birthday</em> Weekend</h1>
    <p class="hint">Compiled in confidence.<br>A name is required to read further.</p>
    <form id="form" autocomplete="off">
      <input type="password" id="pw" placeholder="enter the name" autofocus required>
      <button type="submit" id="btn">Open</button>
    </form>
    <div class="error" id="err">&nbsp;</div>
    <footer>October 2026 · Hudson Valley</footer>
  </main>

const ITER = 250000;

const form = document.getElementById('form');
const pwInput = document.getElementById('pw');
const btn = document.getElementById('btn');
const errEl = document.getElementById('err');

function showError(msg) {
  errEl.textContent = msg;
  errEl.classList.add('show');
  setTimeout(() => errEl.classList.remove('show'), 2400);
}

async function unseal(password) {
  const enc = new TextEncoder();
  const raw = atob(B64);
  const blob = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) blob[i] = raw.charCodeAt(i);

  const salt = blob.slice(0, 16);
  const iv = blob.slice(16, 28);
  const ciphertext = blob.slice(28);

  const passwordKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
    passwordKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv },
    key,
    ciphertext
  );
  return new TextDecoder().decode(decrypted);
}

// Detect missing Web Crypto API up front
if (!window.crypto || !window.crypto.subtle) {
  document.addEventListener('DOMContentLoaded', () => {
    showError('Browser blocked: open this file in Chrome or Firefox, or host it on HTTPS.');
    btn.disabled = true;
    btn.textContent = 'Unavailable';
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = pwInput.value;
  if (!pw) return;
  if (!window.crypto || !window.crypto.subtle) {
    showError('Web Crypto API not available in this context.');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Opening…';
  errEl.classList.remove('show');
  try {
    const html = await unseal(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Open';
    pwInput.value = '';
    pwInput.focus();
    // OperationError = AES-GCM auth tag failed = wrong password
    // Anything else = real bug, show it
    if (err.name === 'OperationError') {
      showError('Not the right name. Try again.');
    } else {
      showError(err.name + ': ' + (err.message || 'unknown error'));
      console.error(err);
    }
  }
});
</script>
